[package]
name = "ovft-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for OVFT requirement tracing core"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ovft-core = { path = "../ovft-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
