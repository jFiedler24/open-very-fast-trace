# Open Very Fast Trace Configuration File
# This file configures the requirements traceability analysis

# Directories containing source code files to scan for tags
source_dirs = ["src", "ovft-core/src", "cargo-ovft/src", "ovft-vscode/src", "docs"]

# Directories containing specification files (markdown)
spec_dirs = ["docs/requirements"]

# File patterns to include when scanning source directories
source_patterns = [
    "*.rs",          # Rust files
    "*.adl",         # Architecture Description Language files
    "*.atl",         # Architecture Template Language files
    "*.java",        # Java files
    "*.c",           # C files
    "*.cpp",         # C++ files
    "*.h",           # Header files
    "*.hpp",         # C++ header files
    "*.py",          # Python files
    "*.js",          # JavaScript files
    "*.ts",          # TypeScript files
    "*.go",          # Go files
    "*.rb",          # Ruby files
    "*.php",         # PHP files
    "*.sh",          # Shell scripts
    "*.sql",         # SQL files
]

# File patterns to exclude when scanning
exclude_patterns = [
    "target/**",
    "node_modules/**",
    ".git/**",
    "*.tmp",
    "*.bak",
    "*.log",
    "build/**",
    "dist/**",
]

# Additional artifact types to recognize in tags
artifact_types = [
    "feat",      # Features
    "req",       # Requirements
    "arch",      # Architecture
    "dsn",       # Design
    "impl",      # Implementation
    "utest",     # Unit tests
    "val",       # Validation test requirements
    "itest",     # Integration tests
    "stest",     # System tests
    "uman",      # User manual
    "oman",      # Operations manual
]

# Whether to generate detailed reports
verbose = false

# Output directory for reports
output_dir = "target"

# Status-based coverage configuration.
# Only items with a counted status contribute to the headline coverage
# statistics; draft and rejected items stay visible in reports (marked as
# "not counted") but do not affect coverage figures or the check exit code.
[status]
count = ["proposed", "approved"]

# Per-status policy for `cargo ovft --check`:
# "fail" = defects of items with this status fail the check (exit code 1),
# "ignore" = defects are reported but never fail the check.
# Statuses not listed here default to "fail".
[status.check]
draft = "ignore"
proposed = "fail"
approved = "fail"
rejected = "ignore"
